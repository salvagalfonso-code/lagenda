name: AgendaIOS
options:
  bundleIdPrefix: com.agendavalenciana
  deploymentTarget:
    iOS: "16.0"
packages:
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios-spm
    exactVersion: 25.17.0
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
targets:
  AgendaIOS:
    type: application
    platform: iOS
    sources:
      - path: AgendaIOS
    dependencies:
      - package: StripePaymentSheet
        product: StripePaymentSheet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agendavalenciana.app.ios
        CODE_SIGN_ENTITLEMENTS: AgendaIOS/AgendaIOS.entitlements
      configs:
        Debug:
          AGENDA_APNS_ENV: development
        Release:
          AGENDA_APNS_ENV: production
        INFOPLIST_FILE: AgendaIOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then exit 0; fi
          cd "$SRCROOT/.."
          sh ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
