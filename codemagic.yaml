
workflows:
  lagenda-compilacio-iphone:
    name: "L'Agenda - COMPILACIO REAL iPhone"
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      java: 17

    scripts:
      - name: "1 - Comprovar projecte i dependències"
        script: |
          #!/bin/bash
          set -euo pipefail
          echo "=== L'AGENDA: COMPILACIO REAL ==="

          PROJECT=$(find "$CM_BUILD_DIR" -type d -name 'AgendaIOS.xcodeproj' -not -path '*/.git/*' -print -quit)

          if [ -z "$PROJECT" ] || [ ! -f "$PROJECT/project.pbxproj" ]; then
            echo "ERROR: No s'ha trobat AgendaIOS.xcodeproj amb project.pbxproj al repositori."
            exit 1
          fi

          ROOT=$(dirname "$(dirname "$PROJECT")")

          if [ ! -f "$ROOT/gradlew" ] || [ ! -d "$ROOT/shared" ]; then
            echo "ERROR: El projecte Xcode existeix, però no té gradlew i shared a la seua carpeta superior."
            echo "Projecte Xcode: $PROJECT"
            echo "Carpeta on calen gradlew i shared: $ROOT"
            exit 1
          fi

          if [ ! -f "$PROJECT/xcshareddata/xcschemes/AgendaIOS.xcscheme" ]; then
            echo "ERROR: Falta l'esquema compartit AgendaIOS.xcscheme."
            exit 1
          fi

          chmod +x "$ROOT/gradlew"
          echo "$PROJECT" > "$CM_BUILD_DIR/lagenda-project-path.txt"
          echo "PROJECTE SELECCIONAT: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: "2 - Compilar L'Agenda per a iPhone"
        script: |
          #!/bin/bash
          set -euo pipefail

          PROJECT=$(cat "$CM_BUILD_DIR/lagenda-project-path.txt")
          mkdir -p "$CM_BUILD_DIR/artifacts"

          xcodebuild build \
            -project "$PROJECT" \
            -scheme AgendaIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/artifacts/xcodebuild.log"

      - name: "3 - Preparar descarrega d'Appetize"
        script: |
          #!/bin/bash
          set -euo pipefail

          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/AgendaIOS.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: No s'ha generat AgendaIOS.app."
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/artifacts"

          ditto -c -k --keepParent "$APP" \
            "$CM_BUILD_DIR/artifacts/lagenda-ios-simulator.zip"

          test -s "$CM_BUILD_DIR/artifacts/lagenda-ios-simulator.zip"
          echo "OK: app compilada i ZIP creat correctament."

    artifacts:
      - artifacts/lagenda-ios-simulator.zip
      - artifacts/xcodebuild.log
