workflows:
  ios_simulator:
    name: LAgenda iOS Simulator ARM64 - Correccio 02
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        JAVA_TOOL_OPTIONS: "-Xmx4g"
    scripts:
      - name: Compilar iOS Simulator i mostrar errors reals
        script: |
          #!/usr/bin/env bash
          set -euo pipefail

          : "${CM_BUILD_DIR:?Falta CM_BUILD_DIR}"
          mkdir -p "$CM_BUILD_DIR/artifacts"

          if [ -d "$CM_BUILD_DIR/ANDROID_STUDIO/iosApp/AgendaIOS.xcodeproj" ]; then
            cd "$CM_BUILD_DIR/ANDROID_STUDIO"
          elif [ -d "$CM_BUILD_DIR/iosApp/AgendaIOS.xcodeproj" ]; then
            cd "$CM_BUILD_DIR"
          else
            echo 'ERROR: no trobe iosApp/AgendaIOS.xcodeproj.'
            exit 2
          fi

          test -f shared/build.gradle.kts
          test -f gradlew

          CLOCK="shared/src/iosMain/kotlin/com/example/agendavalenciana/ios/Clock.ios.kt"
          test -f "$CLOCK"
          if ! grep -Fq 'NSTimeZone.timeZoneWithName("Europe/Madrid")' "$CLOCK"; then
            echo 'ERROR: el projecte no conte Clock.ios.kt de la correccio 02.'
            grep -n 'NSTimeZone' "$CLOCK" || true
            exit 3
          fi

          echo 'CORRECCIO_02_DETECTADA: SI'
          echo "PROJECTE: $(pwd)"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "COMMIT: $(git rev-parse --short HEAD)"
          fi

          LOG="$CM_BUILD_DIR/artifacts/xcodebuild.log"
          if xcodebuild build \
            -project iosApp/AgendaIOS.xcodeproj \
            -scheme AgendaIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO > "$LOG" 2>&1; then
            echo 'XCODEBUILD: OK'
          else
            echo '=== ERRORS CONCRETS ==='
            grep -nE 'error:|^e: |Compilation finished with errors|BUILD FAILED|Unresolved reference|failed' "$LOG" | head -100 || true
            echo '=== ULTIMES 30 LINIES ==='
            tail -30 "$LOG"
            exit 65
          fi

          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/AgendaIOS.app"
          test -d "$APP"
          cd "$(dirname "$APP")"
          ditto -c -k --keepParent AgendaIOS.app "$CM_BUILD_DIR/artifacts/lagenda-ios-simulator.zip"
          echo 'APP SIMULADOR GENERADA'
    artifacts:
      - artifacts/*.zip
      - artifacts/*.log
