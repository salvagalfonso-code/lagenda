workflows:
  ios_simulator:
    name: LAgenda iOS Simulator (ARM64)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        JAVA_TOOL_OPTIONS: "-Xmx4g"
    scripts:
      - name: Compilar iOS Simulator amb Xcode
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cd "$CM_BUILD_DIR"
          test -d iosApp/AgendaIOS.xcodeproj
          test -f shared/build.gradle.kts
          test -f gradlew
          # Detect an outdated or nested repository before starting a long Xcode build.
          python3 - <<'PY_CHECK_SOURCE'
          from pathlib import Path
          p = Path('shared/src/commonMain/kotlin/com/example/agendavalenciana/ios/AgendaIosScreen.kt')
          if not p.is_file():
              raise SystemExit('ERROR: falta shared/.../AgendaIosScreen.kt en l’arrel de GitHub.')
          lines = p.read_text().splitlines()
          for name in ('personalizationImagesRevision', 'feedPrefsServerRevision'):
              defs = [i for i,l in enumerate(lines) if f'var {name} by remember' in l]
              uses = [i for i,l in enumerate(lines) if name in l and i not in defs]
              if len(defs) != 1 or not uses or defs[0] >= min(uses):
                  raise SystemExit(f'ERROR: el repositori encara te una copia antiga: {name} (def={defs}, uses={uses[:3]})')
              print(f'OK: {name} definit a la linia {defs[0]+1}, primer us a la {min(uses)+1}')
          PY_CHECK_SOURCE
          xcodebuild build \
            -project iosApp/AgendaIOS.xcodeproj \
            -scheme AgendaIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$CM_BUILD_DIR/artifacts/xcodebuild.log"
          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/AgendaIOS.app"
          test -d "$APP"
          cd "$(dirname "$APP")"
          ditto -c -k --keepParent AgendaIOS.app "$CM_BUILD_DIR/artifacts/lagenda-ios-simulator.zip"
    artifacts:
      - artifacts/*.zip
      - artifacts/*.log
