workflows:
  lagenda-ios-projecte-complet:
    name: "L'Agenda - iPhone PROJECTE COMPLET"
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      java: 17

    scripts:
      - name: "1 - Comprovar fitxers d'iOS i Kotlin"
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          echo "=== L'AGENDA: COMPROVACIO ==="
          for FILE in iosApp/AgendaIOS.xcodeproj/project.pbxproj iosApp/AgendaIOS.xcodeproj/xcshareddata/xcschemes/AgendaIOS.xcscheme gradlew settings.gradle.kts; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Falta $FILE al repositori. Has de pujar el contingut del ZIP complet, no nomes AgendaIOS.xcodeproj."
              exit 1
            fi
          done
          if [ ! -d shared ]; then
            echo "ERROR: Falta la carpeta shared al repositori."
            exit 1
          fi
          chmod +x gradlew
          xcodebuild -list -project iosApp/AgendaIOS.xcodeproj
          echo "OK: projecte iOS, esquema i estructura Kotlin detectats"

      - name: "2 - Compilar L'Agenda per a simulador iPhone"
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          mkdir -p "$CM_BUILD_DIR/artifacts"
          xcodebuild build \
            -project iosApp/AgendaIOS.xcodeproj \
            -scheme AgendaIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/artifacts/xcodebuild.log"

      - name: "3 - Crear ZIP per a Appetize"
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/AgendaIOS.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: No s'ha generat AgendaIOS.app"
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/artifacts"
          ditto -c -k --keepParent "$APP" "$CM_BUILD_DIR/artifacts/lagenda-ios-simulator.zip"
          test -s "$CM_BUILD_DIR/artifacts/lagenda-ios-simulator.zip"
          echo "OK: lagenda-ios-simulator.zip generat"

    artifacts:
      - artifacts/lagenda-ios-simulator.zip
      - artifacts/xcodebuild.log
