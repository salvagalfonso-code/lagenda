org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Font externa de l'agenda. Si es deixa en blanc, l'app usa quimerafest.com/app.
# Pots sobreescriure-la per entorn sense tocar el codi.
AGENDA_EVENTS_CSV_URL=https://quimerafest.com/app/data/events.csv
AGENDA_REMOTE_BASE_URL=https://quimerafest.com/app/

# API central MySQL/PHP. Tots els dispositius comparteixen esta font.
AGENDA_API_BASE_URL=https://quimerafest.com/app/api/

# Accés amb Google (OAuth 2.0 Web client ID del projecte Google Auth Platform).
# Exemple: 1234567890-xxxxx.apps.googleusercontent.com
AGENDA_GOOGLE_WEB_CLIENT_ID=1022226228982-oockfd11ta6blmools2jmvsg7n5vbpco.apps.googleusercontent.com

# Permet compilar en Windows encara que el directori tinga accents (ex. versió 205).
android.overridePathCheck=true

# Els targets iOS es compilen exclusivament a macOS; Android es pot continuar compilant a Windows.
kotlin.native.ignoreDisabledTargets=true
